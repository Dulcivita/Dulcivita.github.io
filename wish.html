<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模拟原神祈愿</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #87CEEB;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.3) 0%, transparent 30%),
                linear-gradient(180deg, #87CEEB 0%, #B0D4F1 100%);
            width: 100vw;
            height: 100vh;
            color: #fff;
        }

        /* 返回按钮 */
        .wish-back-btn {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 40;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.06em;
            transition: background 0.3s;
            pointer-events: auto;
        }
        .wish-back-btn:hover {
            background: rgba(0, 0, 0, 0.40);
        }

        /* 左侧统计面板 */
        #stats-panel {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 35;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 18px 22px;
            min-width: 160px;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        #stats-panel .stats-title {
            font-size: 13px;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        #stats-panel .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 3px 0;
            color: rgba(255, 255, 255, 0.85);
        }
        #stats-panel .stat-item .stat-name {
            letter-spacing: 0.04em;
        }
        #stats-panel .stat-item .stat-count {
            font-weight: 500;
            color: #fff;
        }
        #stats-panel .stat-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 6px 0;
        }
        #stats-panel .stat-pity {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            padding-top: 4px;
        }
        #stats-panel .stat-pity .pity-label {
            letter-spacing: 0.04em;
        }
        #stats-panel .stat-pity .pity-count {
            color: #FFD700;
            font-weight: 600;
        }

        /* 右上角资源 */
        .wish-resources {
            position: fixed;
            top: 16px;
            right: 24px;
            z-index: 40;
            display: flex;
            gap: 24px;
            align-items: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(6px);
            padding: 8px 20px 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .wish-resource-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .wish-resource-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
        }
        .wish-resource-item .num {
            min-width: 32px;
            text-align: center;
        }

        /* 中央 UP 信息 */
        .wish-up-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 31;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 215, 0, 0.25);
            padding: 18px 48px;
            text-align: center;
            pointer-events: none;
            border-radius: 0;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.05);
        }
        .wish-up-box .up-label {
            font-size: 14px;
            letter-spacing: 0.20em;
            color: rgba(255, 255, 255, 0.50);
            font-weight: 300;
        }
        .wish-up-box .up-name {
            font-size: 32px;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.20);
            letter-spacing: 0.04em;
            margin-top: 2px;
        }

        /* 右下角按钮 */
        .wish-buttons {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 40;
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }
        .wish-btn {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.06em;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wish-btn:hover {
            background: rgba(0, 0, 0, 0.50);
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.25);
        }
        .wish-btn:active {
            transform: scale(0.96);
        }
        .wish-btn .cost {
            font-size: 12px;
            opacity: 0.6;
            font-weight: 300;
        }
        .wish-btn .cost img {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 2px;
        }

        /* 视频遮罩（点击可跳过） */
        #wish-video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
        }
        #wish-video-overlay.active {
            display: flex;
        }
        #wish-video-overlay video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            background: #000;
            pointer-events: none;
        }

        /* 结果展示遮罩 */
        #wish-result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 45;
            background: rgba(0, 0, 0, 0.70);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            flex-direction: column;
            padding: 40px;
        }
        #wish-result-overlay.active {
            display: flex;
        }
        .wish-result-container {
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            overflow-y: auto;
            padding: 20px;
        }
        .wish-result-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px 24px;
            border-radius: 4px;
            text-align: center;
            color: #fff;
            min-width: 100px;
            backdrop-filter: blur(2px);
        }
        .wish-result-item .r-name {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }
        .wish-result-item .r-rarity {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
        }
        .wish-result-item.gold {
            border-color: rgba(255, 215, 0, 0.40);
            background: rgba(255, 215, 0, 0.08);
        }
        .wish-result-item.purple {
            border-color: rgba(180, 80, 255, 0.30);
            background: rgba(180, 80, 255, 0.06);
        }
        .wish-result-item.blue {
            border-color: rgba(80, 160, 255, 0.20);
            background: rgba(80, 160, 255, 0.04);
        }

        /* 金色立绘展示 */
        .wish-result-splash {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 80vw;
            max-height: 80vh;
        }
        .wish-result-splash.active {
            display: flex;
        }
        .wish-result-splash img {
            max-width: 70vw;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.15);
        }
        .wish-result-splash .splash-name {
            color: #FFD700;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.20);
            letter-spacing: 0.06em;
        }
        .wish-result-close {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 46;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #fff;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.06em;
            transition: background 0.3s;
            display: none;
        }
        .wish-result-close.active {
            display: block;
        }
        .wish-result-close:hover {
            background: rgba(0, 0, 0, 0.60);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            #stats-panel {
                top: 72px;
                left: 12px;
                padding: 14px 16px;
                min-width: 130px;
            }
            #stats-panel .stats-title {
                font-size: 11px;
            }
            #stats-panel .stat-item,
            #stats-panel .stat-pity {
                font-size: 12px;
            }
            .wish-resources {
                top: 12px;
                right: 12px;
                padding: 6px 14px 6px 10px;
                gap: 14px;
            }
            .wish-resource-item {
                font-size: 13px;
            }
            .wish-resource-item img {
                width: 22px;
                height: 22px;
            }
            .wish-up-box {
                padding: 14px 28px;
            }
            .wish-up-box .up-name {
                font-size: 24px;
            }
            .wish-buttons {
                bottom: 24px;
                right: 24px;
                gap: 12px;
                flex-direction: column;
                align-items: flex-end;
            }
            .wish-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            .wish-result-item .r-name {
                font-size: 15px;
            }
            .wish-result-splash img {
                max-width: 85vw;
                max-height: 50vh;
            }
            .wish-result-splash .splash-name {
                font-size: 22px;
            }
        }
        @media (max-width: 480px) {
            #stats-panel {
                top: 64px;
                left: 8px;
                padding: 10px 12px;
                min-width: 110px;
            }
            #stats-panel .stats-title {
                font-size: 10px;
            }
            #stats-panel .stat-item,
            #stats-panel .stat-pity {
                font-size: 10px;
                padding: 2px 0;
            }
            .wish-resources {
                top: 8px;
                right: 8px;
                padding: 4px 10px 4px 8px;
                gap: 10px;
            }
            .wish-resource-item {
                font-size: 11px;
            }
            .wish-resource-item img {
                width: 18px;
                height: 18px;
            }
            .wish-up-box {
                padding: 10px 16px;
            }
            .wish-up-box .up-label {
                font-size: 10px;
            }
            .wish-up-box .up-name {
                font-size: 18px;
            }
            .wish-buttons {
                bottom: 16px;
                right: 16px;
                gap: 8px;
                flex-direction: column;
                align-items: flex-end;
            }
            .wish-btn {
                padding: 8px 14px;
                font-size: 12px;
            }
            .wish-btn .cost {
                font-size: 10px;
            }
            .wish-result-item {
                padding: 10px 14px;
                min-width: 70px;
            }
            .wish-result-item .r-name {
                font-size: 13px;
            }
            .wish-result-splash img {
                max-width: 90vw;
                max-height: 45vh;
            }
            .wish-result-splash .splash-name {
                font-size: 18px;
            }
            .wish-result-close {
                padding: 8px 24px;
                font-size: 13px;
                bottom: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- 返回按钮 -->
    <button class="wish-back-btn" id="wishBackBtn">← 返回</button>

    <!-- 左侧统计面板 -->
    <div id="stats-panel">
        <div class="stats-title">📦 出货统计</div>
        <div class="stat-item">
            <span class="stat-name">以理服人</span>
            <span class="stat-count" id="statYilifuren">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-name">阿罗夏</span>
            <span class="stat-count" id="statAluoxia">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-name">迪卢克</span>
            <span class="stat-count" id="statDiluk">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-name">桑多涅</span>
            <span class="stat-count" id="statSandone">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-pity">
            <span class="pity-label">当前抽数</span>
            <span class="pity-count" id="statPity">0</span>
        </div>
    </div>

    <!-- 右上角资源 -->
    <div class="wish-resources">
        <div class="wish-resource-item">
            <img src="qiyuan/yuanshi.png" alt="原石" onerror="this.style.display='none'" />
            <span class="num" id="wishPrimogems">16000</span>
        </div>
        <div class="wish-resource-item">
            <img src="qiyuan/jiuchan.png" alt="纠缠之缘" onerror="this.style.display='none'" />
            <span class="num" id="wishFates">100</span>
        </div>
    </div>

    <!-- 中央 UP 信息 -->
    <div class="wish-up-box">
        <div class="up-label">✦ 当前 UP ✦</div>
        <div class="up-name">桑多涅</div>
    </div>

    <!-- 右下角按钮 -->
    <div class="wish-buttons">
        <button class="wish-btn" id="wishOnceBtn">
            祈愿 1 次
            <span class="cost">
                <img src="qiyuan/jiuchan.png" alt="纠缠" onerror="this.style.display='none'" />1
            </span>
        </button>
        <button class="wish-btn" id="wishTenBtn">
            祈愿 10 次
            <span class="cost">
                <img src="qiyuan/jiuchan.png" alt="纠缠" onerror="this.style.display='none'" />10
            </span>
        </button>
    </div>

    <!-- 视频播放遮罩（点击可跳过） -->
    <div id="wish-video-overlay">
        <video id="wishVideo" muted playsinline></video>
    </div>

    <!-- 结果展示遮罩 -->
    <div id="wish-result-overlay">
        <div class="wish-result-container" id="wishResultContainer"></div>
        <div class="wish-result-splash" id="wishResultSplash">
            <img id="wishSplashImg" src="" alt="角色立绘" />
            <div class="splash-name" id="wishSplashName"></div>
        </div>
        <button class="wish-result-close" id="wishResultClose">确 认</button>
    </div>

    <script>
        // ============================================================
        //  祈愿系统（完整独立 + 统计 + 视频跳过）
        // ============================================================

        // --- DOM 引用 ---
        const wishBackBtn = document.getElementById('wishBackBtn');
        const wishPrimogemsEl = document.getElementById('wishPrimogems');
        const wishFatesEl = document.getElementById('wishFates');
        const wishOnceBtn = document.getElementById('wishOnceBtn');
        const wishTenBtn = document.getElementById('wishTenBtn');
        const videoOverlay = document.getElementById('wish-video-overlay');
        const wishVideo = document.getElementById('wishVideo');
        const resultOverlay = document.getElementById('wish-result-overlay');
        const resultContainer = document.getElementById('wishResultContainer');
        const resultSplash = document.getElementById('wishResultSplash');
        const splashImg = document.getElementById('wishSplashImg');
        const splashName = document.getElementById('wishSplashName');
        const resultClose = document.getElementById('wishResultClose');

        // --- 统计元素 ---
        const statYilifuren = document.getElementById('statYilifuren');
        const statAluoxia = document.getElementById('statAluoxia');
        const statDiluk = document.getElementById('statDiluk');
        const statSandone = document.getElementById('statSandone');
        const statPity = document.getElementById('statPity');

        // --- 资源状态 ---
        let primogems = 16000;
        let fates = 100;

        // --- 保底状态 ---
        let pityCount = 0;
        let guaranteeUp = false;

        // --- 统计对象 ---
        const stats = {
            '以理服人': 0,
            '阿罗夏': 0,
            '迪卢克': 0,
            '桑多涅': 0
        };

        // --- 更新统计UI ---
        function updateStatsUI() {
            statYilifuren.textContent = stats['以理服人'];
            statAluoxia.textContent = stats['阿罗夏'];
            statDiluk.textContent = stats['迪卢克'];
            statSandone.textContent = stats['桑多涅'];
            statPity.textContent = pityCount;
        }

        // --- 更新资源UI ---
        function updateResourceUI() {
            wishPrimogemsEl.textContent = primogems;
            wishFatesEl.textContent = fates;
        }

        // --- 消耗资源 ---
        function consumeResources(amount) {
            const fateCost = amount;
            const primogemCost = amount * 160;
            if (fates >= fateCost) {
                fates -= fateCost;
                updateResourceUI();
                return { ok: true, costType: 'fate' };
            }
            if (primogems >= primogemCost) {
                primogems -= primogemCost;
                updateResourceUI();
                return { ok: true, costType: 'primogem' };
            }
            return { ok: false, costType: null };
        }

        // --- 单抽 ---
        function singlePull() {
            let baseRate = 0.0006;
            if (pityCount >= 72) {
                const extra = (pityCount - 72 + 1) * 0.06;
                baseRate = Math.min(baseRate + extra, 1.0);
            }
            if (pityCount >= 89) {
                baseRate = 1.0;
            }

            const rand = Math.random();
            let result = { rarity: 'blue', name: '以理服人', isGold: false, isPurple: false };

            if (rand < baseRate) {
                pityCount = 0;
                result.isGold = true;
                result.rarity = 'gold';
                if (guaranteeUp || Math.random() < 0.5) {
                    result.name = '桑多涅';
                    guaranteeUp = false;
                } else {
                    result.name = '迪卢克';
                    guaranteeUp = true;
                }
            } else if (rand < baseRate + 0.051) {
                result.isPurple = true;
                result.rarity = 'purple';
                result.name = '阿罗夏';
                pityCount++;
            } else {
                result.rarity = 'blue';
                result.name = '以理服人';
                pityCount++;
            }

            if (result.isGold) {
                pityCount = 0;
            }

            if (stats.hasOwnProperty(result.name)) {
                stats[result.name]++;
            }
            updateStatsUI();

            return result;
        }

        // --- 十连 ---
        function tenPull() {
            const results = [];
            let hasGold = false;
            let hasPurple = false;

            for (let i = 0; i < 9; i++) {
                const r = singlePull();
                results.push(r);
                if (r.isGold) hasGold = true;
                if (r.isPurple) hasPurple = true;
            }

            let tenth;
            if (hasGold || hasPurple) {
                tenth = singlePull();
            } else {
                tenth = { rarity: 'purple', name: '阿罗夏', isGold: false, isPurple: true };
                pityCount++;
                if (stats.hasOwnProperty(tenth.name)) {
                    stats[tenth.name]++;
                }
                updateStatsUI();
            }
            results.push(tenth);
            if (tenth.isGold) hasGold = true;
            if (tenth.isPurple) hasPurple = true;

            const goldResult = results.find(r => r.isGold);
            return { results, hasGold, hasPurple, goldResult };
        }


        function playVideo(videoPath) {
            return new Promise((resolve) => {
                videoOverlay.classList.add('active');
                wishVideo.src = videoPath;
                wishVideo.currentTime = 0;
                wishVideo.play();

                const skipHandler = () => {
                    wishVideo.pause();
                    wishVideo.src = '';
                    videoOverlay.classList.remove('active');
                    clearTimeout(timeout);
                    wishVideo.onended = null;
                    wishVideo.onerror = null;
                    videoOverlay.removeEventListener('click', skipHandler);
                    resolve();
                };
                videoOverlay.addEventListener('click', skipHandler);

                wishVideo.onended = () => {
                    videoOverlay.removeEventListener('click', skipHandler);
                    videoOverlay.classList.remove('active');
                    wishVideo.pause();
                    wishVideo.src = '';
                    clearTimeout(timeout);
                    resolve();
                };

                wishVideo.onerror = () => {
                    console.warn('视频加载失败，跳过:', videoPath);
                    videoOverlay.removeEventListener('click', skipHandler);
                    videoOverlay.classList.remove('active');
                    wishVideo.src = '';
                    clearTimeout(timeout);
                    resolve();
                };

                const timeout = setTimeout(() => {
                    if (videoOverlay.classList.contains('active')) {
                        videoOverlay.removeEventListener('click', skipHandler);
                        videoOverlay.classList.remove('active');
                        wishVideo.pause();
                        wishVideo.src = '';
                        resolve();
                    }
                }, 10000);
            });
        }

        // --- 显示结果 ---
        function showResult(results, hasGold, goldResult) {
            resultOverlay.classList.add('active');
            resultClose.classList.remove('active');
            resultContainer.innerHTML = '';
            resultSplash.classList.remove('active');

            if (hasGold && goldResult) {
                const name = goldResult.name;
                let imgSrc = '';
                if (name === '桑多涅') {
                    imgSrc = 'qiyuan/sdn.png';
                } else if (name === '迪卢克') {
                    imgSrc = 'qiyuan/diluk.png';
                }
                splashImg.src = imgSrc;
                splashName.textContent = '★ ' + name;
                resultSplash.classList.add('active');
                resultClose.classList.add('active');
                resultClose.onclick = () => {
                    resultOverlay.classList.remove('active');
                    resultSplash.classList.remove('active');
                    resultClose.classList.remove('active');
                };
                return;
            }

            results.forEach(r => {
                const div = document.createElement('div');
                div.className = `wish-result-item ${r.rarity}`;
                const nameSpan = document.createElement('div');
                nameSpan.className = 'r-name';
                nameSpan.textContent = r.name;
                const raritySpan = document.createElement('div');
                raritySpan.className = 'r-rarity';
                const rarityMap = { gold: '★ 五星', purple: '★ 四星', blue: '★ 三星' };
                raritySpan.textContent = rarityMap[r.rarity] || '';
                div.appendChild(nameSpan);
                div.appendChild(raritySpan);
                resultContainer.appendChild(div);
            });
            resultClose.classList.add('active');
            resultClose.onclick = () => {
                resultOverlay.classList.remove('active');
                resultClose.classList.remove('active');
                resultContainer.innerHTML = '';
            };
        }

        // --- 执行祈愿 ---
        async function doWish(count) {
            const consume = consumeResources(count);
            if (!consume.ok) {
                alert('资源不足！需要 ' + (count * 160) + ' 原石 或 ' + count + ' 纠缠之缘');
                return;
            }

            let results, hasGold, goldResult;
            if (count === 1) {
                const r = singlePull();
                results = [r];
                hasGold = r.isGold;
                goldResult = r.isGold ? r : null;
            } else {
                const ten = tenPull();
                results = ten.results;
                hasGold = ten.hasGold;
                goldResult = ten.goldResult;
            }

            updateResourceUI();

            let videoPath = '';
            if (count === 1) {
                if (hasGold) videoPath = 'sp/1j.mp4';
                else if (results.some(r => r.isPurple)) videoPath = 'sp/1z.mp4';
                else videoPath = 'sp/1l.mp4';
            } else {
                if (hasGold) videoPath = 'sp/10j.mp4';
                else videoPath = 'sp/10z.mp4';
            }

            try {
                await playVideo(videoPath);
            } catch (e) {
                console.warn('视频播放出错，继续:', e);
            }

            showResult(results, hasGold, goldResult);
        }

        // --- 事件绑定 ---
        wishBackBtn.addEventListener('click', () => {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                history.back();
            } else {
                window.location.href = 'index.html';
            }
        });

        wishOnceBtn.addEventListener('click', () => {
            doWish(1);
        });

        wishTenBtn.addEventListener('click', () => {
            doWish(10);
        });

        // --- 初始化 ---
        updateResourceUI();
        updateStatsUI();


    </script>

</body>
</html>
